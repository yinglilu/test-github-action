name: Push to main

on:
  push:
    branches: [ main ]

jobs:
  # ==========================================
  # Stage 1: 并行执行两个可重用 Job
  # ==========================================
  pre-commit:
    name: "code-check: Pre-Commit"
    uses: ./.github/workflows/reusable/reusable-pre-commit.yml # 👈 调用复用组件

  version-check:
    name: "code-check: Version Check"
    uses: ./.github/workflows/reusable/reusable-version-check.yml # 👈 调用复用组件

  # ==========================================
  # Stage 2: 测试阶段 (Test)
  # 必须等 Stage 1 的两个 Job【全部成功】后才触发
  # ==========================================
# Stage 2: 测试阶段 (并行调用重用工作流)
  # 必须等 Stage 1 的两个检查【全部通过】后才启动
  # ==========================================
  unit-test:
    name: "test: Unit Tests"
    needs: [pre-commit, version-check] # 👈 依赖 Stage 1
    uses: ./.github/workflows/reusable/reusable-unit-test.yml # 👈 调用可重用组件

  integration-test:
    name: "test: Integration Tests"
    needs: [pre-commit, version-check] # 👈 依赖 Stage 1，与 unit-test 并行
    uses: ./.github/workflows/reusable/reusable-integration-test.yml # 👈 调用可重用组件
name: Push to main

on:
  push:
    branches: [ main ]

jobs:
  pre-commit:
    name: "code-check: Pre-Commit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pre-commit # 👈 直接调用本地路径

  version-check:
    name: "code-check: Version Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/version-check

  unit-test:
    name: "test: Unit Tests"
    runs-on: ubuntu-latest
    needs: [pre-commit, version-check]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/unit-test

  integration-test:
    name: "test: Integration Tests"
    runs-on: ubuntu-latest
    needs: [pre-commit, version-check]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/integration-test
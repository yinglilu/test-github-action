name: Version Check

on:
  workflow_call:  # 👈 允许被其他 workflow 调用

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check version
        run: |
          python --version
          # 这里可以替换为你具体的版本检查逻辑，比如检查 pyproject.toml / __init__.py 等
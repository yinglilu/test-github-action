name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # Stage 1: 代码检查阶段 (Lint)
  # ==========================================
  pre-commit:
    name: "Stage 1: Pre-Commit Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yml') }}

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

  # ==========================================
  # Stage 2: 测试阶段 (Test)
  # 只有 Stage 1 成功通过，才会进入此阶段
  # ==========================================
  test:
    name: "Stage 2: Run Tests"
    runs-on: ubuntu-latest
    needs: pre-commit   # 👈 核心关键：这相当于 GitLab 的 stages 依赖关系！
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Tests
        run: |
          python --version
name: Run Tests

on:
  workflow_run:
    workflows: ["Pre-Commit Lint"] # 👈 对应 pre-commit.yml 里的 name
    types:
      - completed # 当 Pre-Commit Lint 运行完成时触发

jobs:
  test:
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Tests
        run: |
          python --version